schema: raw
table_name: places_reviews
primary_key:
- review_id
columns:
- name: place_id
  nullable: false
  type: text
- name: review_id
  nullable: false
  type: text
- name: review_rating
  type: bigint
- name: review_text
  type: text
- name: review_language_code
  type: text
- name: author_display_name
  type: text
- name: author_uri
  type: text
- name: review_publish_time
  type: timestamptz
- default: now()
  name: created_at
  type: timestamp